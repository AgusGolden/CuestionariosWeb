<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuestionarios</title>
  <meta name="description" content="Estudiá con tus propios cuestionarios, sin ver las respuestas antes de tiempo. Repaso espaciado, simulacros de examen y autoevaluación.">
  <meta name="theme-color" content="#11215A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311215A'/%3E%3Cpath d='M12 12.5a4 4 0 1 1 5.6 3.7c-1 .5-1.6 1.3-1.6 2.3V19' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='23.5' r='1.6' fill='%23FB3640'/%3E%3C/svg%3E">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try {
      var tema = JSON.parse(localStorage.getItem('cuestionarios.prefs') || '{}').tema;
      if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-interior">
      <a href="#/" class="marca" aria-label="Cuestionarios, ir al inicio">
        <span class="marca-logo" aria-hidden="true">?</span>
        <span class="marca-texto">Cuestionarios</span>
      </a>
      <nav class="nav" id="nav" aria-label="Secciones">
        <a href="#/" data-nav="inicio">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Biblioteca</span>
        </a>
        <a href="#/estudiar" data-nav="estudiar">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
          <span>Estudiar</span>
        </a>
        <a href="#/nuevo" data-nav="nuevo">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Crear</span>
        </a>
        <a href="#/datos" data-nav="datos">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span>Datos</span>
        </a>
      </nav>
      <div class="topbar-acciones">
        <button type="button" class="icono-btn" id="btn-atajos" title="Atajos de teclado (?)" aria-label="Atajos de teclado">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        </button>
        <button type="button" class="icono-btn" id="btn-tema" title="Cambiar tema" aria-label="Cambiar tema"></button>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div class="aviso-soltar" aria-hidden="true">Soltá el archivo para importarlo</div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/sesion.js"></script>
  <script src="js/views/resultados.js"></script>
  <script src="js/views/configurar.js"></script>
  <script src="js/views/biblioteca.js"></script>
  <script src="js/views/ver.js"></script>
  <script src="js/views/editor.js"></script>
  <script src="js/views/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
